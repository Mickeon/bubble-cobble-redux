[ambientCamera]
	#Master switch for Ambient Camera.
	enabled = true
	#Seconds without keyboard or mouse input before the cinematic camera starts.
	# Default: 300
	# Range: 5 ~ 3600
	idleSeconds = 300
	#Hide the HUD while Ambient Camera is active. The previous HUD state is restored on exit.
	hideHud = true
	#Show a short action-bar message when the automatic camera starts or stops.
	showStatusMessages = false
	#Seconds each player, scenery, or mob shot remains on screen before the next cut.
	# Default: 12.0
	# Range: 4.0 ~ 120.0
	shotDurationSeconds = 12.0
	#Cut instantly to the next camera angle instead of flying across the scene.
	hardCuts = false
	#Single transition effect and fallback for older configurations. The checkmark list uses this value when random transitions are disabled.
	transitionEffect = 18
	#Seconds used for each half of the transition: cover and reveal.
	# Default: 1.0
	# Range: 0.1 ~ 3.0
	fadeDurationSeconds = 1.5
	#Global multiplier for the subtle camera motion inside a shot. 0 freezes the angle; 2 doubles the speed.
	# Default: 0.7
	# Range: 0.0 ~ 4.0
	cameraSpeed = 0.7
	#Tracking softness inside a shot. This does not soften shot changes while hardCuts is enabled.
	# Default: 0.8
	# Range: 0.1 ~ 8.0
	transitionSeconds = 0.8
	#How far ahead, in blocks, scenery shots search for a landscape focus point.
	# Default: 32.0
	# Range: 8.0 ~ 64.0
	sceneryFocusDistance = 48.0
	#Allow dedicated shots to focus on a nearby mob that is visibly moving.
	enableMobFocus = true
	#Maximum distance in blocks for selecting a moving mob as a camera subject.
	# Default: 32.0
	# Range: 6.0 ~ 64.0
	mobFocusRange = 48.0
	#Exclude hostile mobs from camera focus regardless of their location or light level.
	excludeHostileMobs = true
	#Exclude bats from camera focus regardless of their location or light level.
	excludeBats = true
	#Keep counting inactivity while chat or the command input is open. The screen closes when Ambient Camera starts.
	idleWhileChatOpen = false
	#Keep counting inactivity while an inventory or container screen is open. The screen closes when Ambient Camera starts.
	idleWhileContainerOpen = false
	#FPS limit while Ambient Camera is active. 0 keeps the normal Minecraft video setting.
	ambientFpsLimit = 0
	#Allow the cinematic camera to pass through walls instead of stopping in front of them.
	allowWallClipping = false
	#Distance in blocks kept between the camera and the wall it hits.
	# Default: 0.25
	# Range: 0.05 ~ 1.0
	collisionPadding = 0.25
	#Show black cinematic bars at the top and bottom while Ambient Camera is active.
	showCinematicBars = true
	#Height of each cinematic bar as a percentage of the screen height. 13 percent approximates 2.39:1 on a 16:9 display.
	# Default: 13
	# Range: 0 ~ 25
	cinematicBarPercent = 3
	#When enabled, choose one of the checked transition effects at random for each shot change.
	randomTransitionEffects = true
	#Internal checkmark selection as a bit mask for transition effects 0 through 18. Zero inherits transitionEffect from an older configuration.
	# Default: 0
	# Range: 0 ~ 524287
	selectedTransitionEffects = 524282
	#Count inactivity on the pause menu only while connected to a remote multiplayer server. Never start from the pause menu in singleplayer.
	idleWhileMultiplayerPause = true
