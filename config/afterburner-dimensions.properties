# Afterburner: settings by dimension. <dimension> is overworld, the_nether, the_end, a full id such as mymod:mine, or
# default (any dimension without a line of its own). A dimension without a line keeps vanilla's behavior. The settings
# only matter when the switch they belong to is on in the settings screen or afterburner.properties.
#
# -- Dropped items (switch dimensionItems, off by default) --
#   <dimension>.itemLifetimeTicks   how long a dropped item lasts, in ticks (vanilla 6000 = 5 minutes), 60 to 72000
#   <dimension>.itemMergeRadius     how close dropped items must be to merge, in blocks (vanilla 0.5), 0.5 to 8
#   <dimension>.itemsPerChunk       the most item entities one chunk may hold: past it the oldest are removed (0 = no limit)
# An item whose lifespan another mod or a command set is left alone. Item farms that leave items lying around for a
# while (gold farms in the Nether, for instance) may need a longer lifetime or no limit: change the lines below for them.
the_nether.itemLifetimeTicks=3000
the_nether.itemMergeRadius=1.5
the_end.itemLifetimeTicks=3000
the_end.itemMergeRadius=1.5
#overworld.itemLifetimeTicks=6000
#default.itemsPerChunk=200
